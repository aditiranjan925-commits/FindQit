name: Build FindQit APK

'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  # Step 1: Download repository
  - name: Checkout code
    uses: actions/checkout@v4

  # Step 2: Install Java
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  # Step 3: Install Gradle
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  # Step 4: Create Firebase configuration
  - name: Create Firebase config
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    run: |
      if [ -z "$GOOGLE_SERVICES_JSON" ]; then
        echo "Firebase secret is missing"
        exit 1
      fi
      printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

  # Step 5: Generate SHA fingerprints
  - name: Generate SHA fingerprints
    run: gradle --no-daemon signingReport

  # Step 6: Build Android APK
  - name: Build APK
    run: gradle --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" assembleDebug

  # Step 7: Upload APK
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FindQit-APK
      path: app/build/outputs/apk/debug/app-debug.apk
